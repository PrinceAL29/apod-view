<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOD View</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <h1 id="title">Loading..</h1>
    <p id="date"></p>
    <a id="link" href="http://" target="_blank" rel="noopener noreferrer">
        <img id="image" src="" alt="">
    </a>
    <p id="explanation"></p>
    <div id="loading">Loading..</div>
    <div class="input-box">
        <button id="prev-btn" class="arow-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                style="vertical-align: middle;">
                <path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="3" fill="none" />
            </svg>
        </button>

        <input type="date" id="dateObj" min="2001-01-01" />

        <button id="next-btn" disabled class="arow-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                style="vertical-align: middle;">
                <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="3" fill="none" />
            </svg>
        </button>
        <button id="random-btn">Explore</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
